# Apache site for the TeachWise demo container. ${PORT} comes from the environment (Render sets it).
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.html index.php
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
